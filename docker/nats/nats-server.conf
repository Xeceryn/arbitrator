# Client port (default)
port = 4222

# HTTP monitoring interface (for /varz, /connz, etc.)
http_port = 8222

# Cluster configuration
cluster {
  name = "arbitrator"

  # Cluster listen port
  port = 6222

  # Authorization for routes
  authorization {
    user = "sulthonuladib"
    password = "123456"
    timeout = 2
  }

  # List of other nodes to connect to (can be empty on seed node)
  routes = []
}

